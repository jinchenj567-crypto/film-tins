<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1f20" />
    <title>Four Film Tins</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f5fa8'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f4c430' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="stage" aria-label="灯下的桌子，上面有四个旧胶片铁盒和一封信"></canvas>
    <p id="load">正在找铁盒</p>
    <div id="finder" hidden aria-hidden="true"><div id="eyepiece"><div id="brightlines"></div><div id="patch"></div></div></div>
    <div id="ui">
      <p id="hint" aria-live="polite"></p>
      <div id="lightbar" hidden>
        <div id="gels" role="group" aria-label="光的颜色"></div>
        <label id="level" class="fader">亮度 <input type="range" min="0.2" max="1.8" step="0.01" value="1" /></label>
      </div>
      <div id="cambar" hidden>
        <button type="button" id="speed"></button>
        <button type="button" id="stop"></button>
        <label id="focus" class="fader">对焦 <input type="range" min="0" max="1" step="0.005" value="0.6" /></label>
      </div>
      <div id="actions"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
